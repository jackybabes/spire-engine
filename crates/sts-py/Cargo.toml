[package]
name = "sts-py"
edition.workspace = true
version.workspace = true

[lib]
name = "sts"
crate-type = ["cdylib"]

[dependencies]
sts-core = { path = "../sts-core" }
sts-encode = { path = "../sts-encode" }
serde_json = "1"
rayon = "1"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }

[build-dependencies]
pyo3-build-config = "0.29"
